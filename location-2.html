<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top Travel Spots in Canada | Photo Gallery</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Load Bootstrap before the custom lightbox code. -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    defer></script>
  <script src="js/style.js" defer></script>
</head>

<body id="top">
  <a href="#main_content" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul class="button-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="location-1.html">United States of America</a></li>
        <li class="current">
          <a href="location-2.html" aria-current="page">Canada</a>
        </li>
      </ul>

      <button id="theme-toggle" type="button" aria-pressed="false">
        🌙 Dark Mode
      </button>
    </nav>

    <h1>North America : Canada Edition</h1>
  </header>

  <main id="main_content" class="container my-4">
    <section aria-labelledby="gallery-heading">
      <h2 id="gallery-heading">Best Places to Visit Gallery</h2>
      <p>Select a photo to view it larger.</p>

      <div class="gallery-grid">
        <figure>
          <button
            class="lightbox-trigger"
            type="button"
            data-caption="Banff National Park (Alberta)"
            aria-label="">
            <img
              class="gallery-thumbnail"
              src="https://live.staticflickr.com/7090/6992401196_573b11e46d_b.jpg"
              alt="Lakeside view of Banff National Park">
          </button>
          <figcaption>Banff National Park</figcaption>
        </figure>

        <figure>
          <button
            class="lightbox-trigger"
            type="button"
            data-caption="Jasper National Park (Alberta)"
            aria-label="">
            <img
              class="gallery-thumbnail"
              src="https://live.staticflickr.com/4329/35229275493_ddd3624731_b.jpg" 
              alt="View of Jasper National Park from Whistlers Mountain">
          </button>
          <figcaption>Jasper National Park</figcaption>
        </figure>

        <figure>
          <button
            class="lightbox-trigger"
            type="button"
            data-caption="Niagara Falls (Ontaria)"
            aria-label="">
            <img
              class="gallery-thumbnail"
              src="https://live.staticflickr.com/4508/26146993129_404a8a675f_b.jpg"
              alt="Canadian Horseshoe Falls at Niagara Falls, Ontario, Canada ">
          </button>
          <figcaption>Canadian Horseshoe Falls at Niagara Falls</figcaption>
        </figure>

        <figure>
          <button
            class="lightbox-trigger"
            type="button"
            data-caption="Gros Morne National Park (Newfoundland)"
            aria-label="Gros Morne National Park (Newfoundland)">
            <img
              class="gallery-thumbnail"
              src="https://live.staticflickr.com/65535/51369128004_a676117691_b.jpg"
              
              alt="Road going through Gros Morne National Park (Newfoundland)">
          </button>
          <figcaption>Roadway through Gros Morne National Park </figcaption>
        </figure>

        <figure>
          <button
            class="lightbox-trigger"
            type="button"
            data-caption="Whistler (British Columbia)"
            aria-label="Whistler (British Columbia)">
            <img
              class="gallery-thumbnail"
src="https://live.staticflickr.com/65535/52120875675_faa863bf09_b.jpg"
              alt="View of Whistler National Park (British Columbia)">
          </button>
          <figcaption> Whistler (British Columbia)</figcaption>
        </figure>

        <figure>
          <button
            class="lightbox-trigger"
            type="button"
            data-caption="Cape Breton Highlands National Park (Nova Scotia)"
            aria-label="Cape Breton Highlands National Park (Nova Scotia)">
            <img
              class="gallery-thumbnail"
src="https://live.staticflickr.com/65535/53900146579_0d5e6dc906_b.jpg" 
              alt="Waterside view of Cape Breton Highlands National Park (Nova Scotia)">
          </button>
          <figcaption>Cape Breton Highlands National Park (Nova Scotia)</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <div
    class="modal fade"
    id="lightbox"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="lightbox-caption"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header border-0">
          <p class="modal-title" id="lightbox-caption"></p>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
            aria-label="Close lightbox"></button>
        </div>

        <div class="modal-body text-center">
          <img class="lightbox-image" id="lightbox-image" src="" alt="">
        </div>

        <div class="modal-footer border-0 justify-content-between">
          <button
            type="button"
            class="btn btn-outline-light"
            id="previous-image">
            Previous
          </button>
          <button
            type="button"
            class="btn btn-outline-light"
            id="next-image">
            Next
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="floating-footer">
    <a href="#top">Back to top</a>
    <a href="index.html">Home</a>
  </footer>
</body>
</html>
