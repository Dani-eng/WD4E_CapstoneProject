<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Photo Gallery</title>
  <link rel="stylesheet" href="css/gallery.css">
  <script src="js/gallery.js" defer></script>
</head>

<body>
  <a href="#main_content" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation">
      <ul class="button-list">
        <li class="current"><a href="index.html" aria-current="page">Home</a></li>
        <li><a href="#location-1">Location 1</a></li>
        <li><a href="#location-2">Location 2</a></li>
      </ul>
    </nav>

    <h1>Title</h1>
  </header>

  <main id="main_content">
    <section aria-labelledby="general-info">
      <h2 id="general-info">General Info</h2>
      <p>
        Explore this photo gallery featuring a selection of dog breeds.
        Hover over or focus on a photo to display it in the preview area.
      </p>

      <div id="image" tabindex="0" aria-live="polite">
        Hover over or focus on an image below to display it here.
      </div>

      <div class="gallery">
        <figure id="location-1">
          <img class="preview"
               src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/American_Pit_Bull_Terrier_-_Seated.jpg/250px-American_Pit_Bull_Terrier_-_Seated.jpg"
               alt="Seated American Pit Bull Terrier"
               onmouseover="upDate(this)"
               onmouseout="unDo()"
               onfocus="upDate(this)"
               onblur="unDo()">
          <figcaption>
            <strong>American Pit Bull Terrier:</strong>
            A seated dog photographed outdoors.
          </figcaption>
        </figure>

        <figure>
          <img class="preview"
               src="https://live.staticflickr.com/69/184161283_d7a0e8c0b1_z.jpg"
               alt="Seated Alaskan Husky"
               onmouseover="upDate(this)"
               onmouseout="unDo()"
               onfocus="upDate(this)"
               onblur="unDo()">
          <figcaption>
            <strong>Alaskan Husky:</strong>
            A husky sits for a portrait.
          </figcaption>
        </figure>

        <figure>
          <img class="preview"
               src="https://live.staticflickr.com/4117/4751390781_f8fa970e1e_z.jpg"
               alt="Seated Boston Terrier"
               onmouseover="upDate(this)"
               onmouseout="unDo()"
               onfocus="upDate(this)"
               onblur="unDo()">
          <figcaption>
            <strong>Boston Terrier:</strong>
            A small dog sits calmly for the camera.
          </figcaption>
        </figure>

        <figure id="location-2">
          <img class="preview"
               src="https://upload.wikimedia.org/wikipedia/commons/6/69/Catahoula_Leopard_Hound_Dog.jpg"
               alt="Catahoula Leopard Hound"
               onmouseover="upDate(this)"
               onmouseout="unDo()"
               onfocus="upDate(this)"
               onblur="unDo()">
          <figcaption>
            <strong>Catahoula Leopard Hound:</strong>
            This dog’s coat has a distinctive spotted pattern.
          </figcaption>
        </figure>

        <figure>
          <img class="preview"
               src="https://upload.wikimedia.org/wikipedia/commons/2/2d/Toy_Fox_Terrier.jpg"
               alt="Standing Toy Fox Terrier"
               onmouseover="upDate(this)"
               onmouseout="unDo()"
               onfocus="upDate(this)"
               onblur="unDo()">
          <figcaption>
            <strong>Toy Fox Terrier:</strong>
            A standing terrier poses for a photo.
          </figcaption>
        </figure>

        <figure>
          <img class="preview"
               src="https://upload.wikimedia.org/wikipedia/commons/1/12/Bojars%27s_english_cocker_spaniel.jpg"
               alt="English Cocker Spaniel lying down"
               onmouseover="upDate(this)"
               onmouseout="unDo()"
               onfocus="upDate(this)"
               onblur="unDo()">
          <figcaption>
            <strong>English Cocker Spaniel:</strong>
            A spaniel rests with its long ears visible.
          </figcaption>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
